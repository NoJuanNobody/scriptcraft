[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/NoJuanNobody/scriptcraft"

[workspace.dependencies]
# internal
scriptcraft-geom = { path = "crates/geom" }
scriptcraft-doc = { path = "crates/doc" }
scriptcraft-fonts = { path = "crates/fonts" }
scriptcraft-fountain = { path = "crates/fountain" }
scriptcraft-fdx = { path = "crates/fdx" }
scriptcraft-layout = { path = "crates/layout" }
scriptcraft-pdf = { path = "crates/pdf" }
scriptcraft-spell = { path = "crates/spell" }
scriptcraft-collab = { path = "crates/collab" }
scriptcraft-import = { path = "crates/import" }
scriptcraft-engine = { path = "crates/engine" }
scriptcraft-control-key = { path = "crates/control-key" }
scriptcraft-mcp = { path = "crates/mcp" }
scriptcraft-ui-egui = { path = "crates/ui-egui" }

# Shared Craft-suite libraries (storytold/craft-libs), pinned to a reviewed revision.
# craft-settings: config.toml storage with the suite's folder rules (craft-libs#22).
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "6006abb757df7030ffdd78c4fc952904a9d36491" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
quick-xml = "0.41"
krilla = "0.8"
getrandom = "0.3"
flate2 = "1"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
