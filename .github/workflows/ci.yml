name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, Monday 06:00 UTC: catches breakage from a new stable Rust or from
  # newer versions of our dependencies even in weeks with no commits.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Set but empty: isolated, so no test or tool ever writes a real settings profile on a runner.
  SCRIPTCRAFT_CONFIG_DIR: ""

jobs:
  checks:
    name: Checks (Linux, full gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the window and GPU stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libudev-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Use the newest compatible dependency versions (weekly run only)
        if: github.event_name == 'schedule'
        run: cargo update --verbose
      - name: cargo xtask ci (fmt, clippy, tests, assets, layers, parity doc, browser build)
        run: cargo xtask ci

  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Use the newest compatible dependency versions (weekly run only)
        if: github.event_name == 'schedule'
        run: cargo update --verbose
      - name: Build everything (apps, tests, examples)
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
