<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScriptCraft</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #dcdee3; }
    @media (prefers-color-scheme: dark) { html, body { background: #14161a; } }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; font: 14px system-ui, sans-serif; color: #6b6f7a; }
  </style>
</head>
<body>
  <div id="loading">Loading ScriptCraft…</div>
  <canvas id="scriptcraft"></canvas>
  <script type="module">
    import init from "./scriptcraft_web.js";
    init().then(() => document.getElementById("loading").remove());
  </script>
</body>
</html>
