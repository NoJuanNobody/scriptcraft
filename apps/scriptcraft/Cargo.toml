[package]
name = "scriptcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "scriptcraft"
description = "ScriptCraft desktop app"

[lints]
workspace = true

[dependencies]
scriptcraft-doc = { workspace = true }
scriptcraft-engine = { workspace = true }
scriptcraft-ui-egui = { workspace = true }
scriptcraft-control-key = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
# SIGTERM / SIGINT / SIGHUP: save a recovery copy and remove the control key before exiting.
ctrlc = { version = "3.5", features = ["termination"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Turn off winit's default macOS menu: its Quit item calls `terminate:` directly, skipping the
# unsaved-changes prompt. Without it, Cmd+Q reaches the app as a normal shortcut (ui.quit).
# Already in the build through eframe, at this version.
winit = { version = "0.30", default-features = false }
